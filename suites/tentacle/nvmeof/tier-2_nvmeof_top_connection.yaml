# ---
tests:

  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                allow-overwrite: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node10
        copy_admin_keyring: true
        install_packages:
          - ceph-common
      desc: Setup NVMe-oF initiator / client node
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests
      polarion-id: CEPH-83573758

  # -----------------------------------------------------------------------
  # Polarion CEPH-83633026 – two gateway groups (group1 active, group2 idle)
  # -----------------------------------------------------------------------
  - test:
      abort-on-fail: false
      config:
        install: true
        rbd_pool: rbd
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        # Polarion asks ≥60s per block size; override lower for faster debug runs
        bs_sweep_runtime: 60
        # Dedicated secure listener port for STEP-17/18 TLS-PSK top checks
        tls_listener_port: 4421
        cleanup:
          - subsystems
          - initiators
          - disconnect_all
          - pool
          - gateway
        gw_groups:
          # Group A – active multipath IO; primary top-connection target
          - gw_group: group1
            nvme_metadata_pool: rbd
            # Required for STEP-17/18 host add --psk (encrypts stored PSK)
            enable_encryption: true
            encryption_key_path: true
            gw_nodes:
              - node6
              - node7
            listener_port: 4420
            subsystems:
              - nqn: nqn.2016-06.io.spdk:cnode1
                no-group-append: true
                bdevs:
                  count: 2
                  size: 4G
                  rbd-create-image: true
                listeners:
                  - node6
                  - node7
                listener_port: 4420
                # Specific initiator host NQN (not allow-any "*")
                hosts:
                  - node: node10
            initiators:
              - nqn: connect-all
                listener_port: 4420
                node: node10
          # Group B – deployed with subsystem/NS/listeners but NO initiator.
          # Polarion STEP-07: --gw-group group2 must return empty connection stats
          # while IO runs only on group1.
          - gw_group: group2
            nvme_metadata_pool: rbd
            enable_encryption: true
            encryption_key_path: true
            gw_nodes:
              - node8
              - node9
            listener_port: 4420
            subsystems:
              - nqn: nqn.2016-06.io.spdk:cnode2
                no-group-append: true
                bdevs:
                  count: 2
                  size: 4G
                  rbd-create-image: true
                listeners:
                  - node8
                  - node9
                listener_port: 4420
                # No hosts / no allow-any → empty connection set for --gw-group filter
      desc: >
        CEPH-83633026 / IBMCEPH-15738: Validate ceph nvmeof top connection across
        two GW groups (4-node HA topology). group1 carries initiator IO; group2
        has no connections for --gw-group filter validation.
      destroy-cluster: false
      module: test_ceph_nvmeof_top_connection.py
      name: "CEPH-83633026: ceph nvmeof top connection - host connection iostat"
      polarion-id: CEPH-83633026
